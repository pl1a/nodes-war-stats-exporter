name: Package Executable & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            platform_suffix: linux
            extension: ''
          - os: windows-latest
            platform_suffix: windows
            extension: '.exe'
          - os: macos-latest
            platform_suffix: macos
            extension: ''

    runs-on: ${{ matrix.os }}

  env:
    FINAL_NAME: nodes-war-stats-exporter-${{ github.ref_name }}-${{ matrix.platform_suffix }}${{ matrix.extension }}

  steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install -r requirements.txt

    - name: Build Executable with PyInstaller
      run: |
        pyinstaller --onefile --name="${{ env.FINAL_NAME }}" -w main.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.FINAL_NAME }}
        path: dist/${{ env.FINAL_NAME }}

      release:
        needs: build
      runs-on: ubuntu-latest
      steps:
        - name: Download All Artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Move Artifacts to Single Directory
      run: |
        mkdir dist-release
        find artifacts -type f -exec mv {} dist-release/ \;
        ls -R dist-release

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: dist-release/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

